name: test

on:
  pull_request:
  workflow_dispatch:

jobs:
  repository-tests:
    runs-on: ubuntu-latest
    steps:
      # Pull the repository contents into the runner.
      - name: Check out repository
        uses: actions/checkout@v4

      # Install Terraform to run syntax and initialization checks.
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      # Validate the Azure-native Bicep assets in a runner that already has Azure CLI available.
      - name: Validate Bicep templates
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -euo pipefail
            for file in azure/*/main.bicep; do
              az bicep build --file "$file" >/dev/null
            done

      # Run initialization without backend configuration because this is a portfolio repository.
      - name: Terraform init and validate
        shell: bash
        run: |
          set -euo pipefail
          for dir in terraform/landing-zone terraform/networking terraform/aks-cluster terraform/monitoring; do
            terraform -chdir="$dir" init -backend=false
            terraform -chdir="$dir" validate
          done

      # Use kubeconform to validate manifest schemas against the Kubernetes API.
      - name: Validate Kubernetes manifests with kubeconform
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/workdir" -w /workdir ghcr.io/yannh/kubeconform:latest \
            -strict \
            -summary \
            $(find kubernetes -type f -name '*.yaml')

      # Confirm the demo container still serves its health and metrics endpoints after hardening.
      - name: Test demo container endpoints
        shell: bash
        run: |
          set -euo pipefail
          docker build -t cloud-infrastructure-blueprints:test ./docker
          container_id="$(docker run -d -p 18080:8080 cloud-infrastructure-blueprints:test)"
          trap 'docker rm -f "$container_id"' EXIT
          curl --fail --silent http://127.0.0.1:18080/healthz >/dev/null
          metrics="$(curl --fail --silent http://127.0.0.1:18080/metrics)"
          grep -Eq 'demo_http_requests_total [1-9][0-9]*' <<<"$metrics"
