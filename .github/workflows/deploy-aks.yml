name: deploy-aks

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - docker-image
    types:
      - completed

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write
      contents: read
    steps:
      # Pull the repository so manifests can be applied to the cluster.
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      # Log in to Azure using workload identity or repository secrets.
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Fetch AKS credentials for the target cluster and resource group.
      - name: Get AKS credentials
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ secrets.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}

      # Apply namespace, configuration, workload, service, ingress, and autoscaling assets in dependency order.
      - name: Deploy Kubernetes manifests
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${{ github.repository }}:${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}"
          kubectl apply -f kubernetes/namespaces/platform.yaml
          kubectl apply -f kubernetes/networking/platform-web-networkpolicy.yaml
          kubectl apply -f kubernetes/secrets/app-configmap.yaml
          kubectl create secret generic platform-web-secrets \
            --namespace platform-demo \
            --from-literal=API_KEY="${{ secrets.PLATFORM_WEB_API_KEY }}" \
            --from-literal=DATABASE_URL="${{ secrets.PLATFORM_WEB_DATABASE_URL }}" \
            --dry-run=client \
            -o yaml | kubectl apply -f -
          kubectl apply -f kubernetes/deployments/app-deployment.yaml
          kubectl apply -f kubernetes/resilience/platform-web-pdb.yaml
          kubectl set image deployment/platform-web web="$IMAGE" -n platform-demo
          kubectl apply -f kubernetes/deployments/app-service.yaml
          kubectl apply -f kubernetes/ingress/app-ingress.yaml
          kubectl apply -f kubernetes/autoscaling/app-hpa.yaml
          kubectl rollout status deployment/platform-web -n platform-demo --timeout=180s
