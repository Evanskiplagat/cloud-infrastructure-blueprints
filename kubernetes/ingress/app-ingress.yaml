# Publish the sample workload behind an ingress controller with TLS termination.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: platform-web
  namespace: platform-demo
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - platform.example.com
      secretName: platform-web-tls
  rules:
    - host: platform.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: platform-web
                port:
                  number: 80
