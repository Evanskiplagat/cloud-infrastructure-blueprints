# Prometheus alert rules focused on availability and capacity signals for the demo workload.
groups:
  - name: platform-web.rules
    rules:
      - alert: PlatformWebHighCpu
        expr: sum(rate(container_cpu_usage_seconds_total{namespace="platform-demo"}[5m])) > 0.8
        for: 10m
        labels:
          severity: warning
          service: platform-web
        annotations:
          summary: "Platform web workload CPU usage is elevated"
          description: "Average CPU usage for the platform-demo workload has remained high for 10 minutes."

      - alert: PlatformWebReplicasUnavailable
        expr: kube_deployment_status_replicas_available{namespace="platform-demo",deployment="platform-web"} < 2
        for: 5m
        labels:
          severity: critical
          service: platform-web
        annotations:
          summary: "Platform web deployment has insufficient replicas"
          description: "The platform-web deployment has fewer than two available replicas."

