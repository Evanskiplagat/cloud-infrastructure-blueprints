# Prometheus alert rules focused on availability and capacity signals for the demo workload.
groups:
  - name: platform-web.rules
    rules:
      - alert: PlatformWebDown
        expr: up{job="platform-web"} == 0
        for: 5m
        labels:
          severity: critical
          service: platform-web
        annotations:
          summary: "Platform web metrics endpoint is unavailable"
          description: "Prometheus has not been able to scrape the platform-web target for 5 minutes."

      - alert: PlatformWebTrafficMissing
        expr: increase(demo_http_requests_total{job="platform-web"}[15m]) < 1
        for: 15m
        labels:
          severity: warning
          service: platform-web
        annotations:
          summary: "Platform web is receiving no traffic"
          description: "The demo workload has not reported any HTTP requests during the last 15 minutes."
